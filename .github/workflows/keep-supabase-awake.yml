# Keeps the Supabase project from auto-pausing.
#
# The free tier pauses a project after about a week with no database activity,
# and a paused project answers nothing. The frontend still serves from Vercel,
# so the failure looks like a broken app rather than a sleeping database: the
# page renders, hangs, and refuses to log in. That cost an afternoon to
# diagnose on 23 October 2026.
#
# A read every three days was NOT enough. Between 25 October and 1 November
# every scheduled run returned HTTP 200 from a select against budget_pots, and
# Supabase paused the project anyway on 4 November, seven days after the last
# real use of the app. An RLS-filtered read that returns an empty array does
# not appear to register as activity.
#
# So this now writes: one row updated daily through the ping_heartbeat()
# function added in migration 012. A write cannot be mistaken for an idle
# database. Daily rather than every third day, because the pause window is
# seven days and three strikes should be possible before anything is lost.
#
# Needs two repository secrets, under Settings > Secrets and variables >
# Actions:
#   SUPABASE_URL        https://qyorosazvaqgbknjdhou.supabase.co
#   SUPABASE_ANON_KEY   the publishable key (sb_publishable_...)
#
# Both are already public in the deployed bundle, so neither is sensitive.
# They live in secrets to keep the project reference out of a public repo.

name: Keep Supabase awake

on:
  schedule:
    # 07:14 UTC daily. An odd minute on purpose: the hour and the half hour
    # are heavily contended on GitHub's shared runners and get queued.
    - cron: "14 7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is not set in repository secrets."
            exit 1
          fi

          # Length is printed because GitHub masks the secret itself but not
          # its length, and a truncated or stale paste is the likeliest way
          # this breaks. A publishable key is 46 characters.
          echo "key length: ${#SUPABASE_ANON_KEY}  url: $SUPABASE_URL"

          # Only the apikey header. Publishable keys belong there; Authorization
          # is for a signed-in user's token, and sending the publishable key in
          # it gets the whole request rejected as an invalid key.
          code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping_heartbeat" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP $code"
          head -c 300 /tmp/body; echo

          # 200 returns the new timestamp, which is proof a row was written
          # rather than merely read. 404 means migration 012 has not been run
          # on this project, which is the one failure the old version could not
          # have produced and so is worth naming.
          # Distinguish the causes rather than blaming the pause for everything.
          case "$code" in
            200) ;;
            404)
              echo "::error::ping_heartbeat() is missing (HTTP 404). Run supabase/migrations/012_heartbeat.sql in the SQL editor."
              exit 1 ;;
            401|403)
              echo "::error::Supabase rejected the key (HTTP $code). The project is awake but SUPABASE_ANON_KEY is wrong. Re-copy the publishable key from .env.local or the dashboard."
              exit 1 ;;
            000)
              echo "::error::No response at all (timeout or DNS). The project is likely paused, or the URL is wrong."
              exit 1 ;;
            *)
              echo "::error::Supabase answered HTTP $code. See the body above."
              exit 1 ;;
          esac

          echo "Supabase is awake, and the heartbeat row was written."
